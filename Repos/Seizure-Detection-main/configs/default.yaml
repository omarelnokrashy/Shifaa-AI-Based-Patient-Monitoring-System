# Seizure Detection System - Default Runtime Configuration

# Model weight paths are relative to the deployable repo root.
model_weights_dir: model_weights

pose_checkpoint: pose.pth
pose_repo: vendor/lightweight-human-pose-estimation.pytorch
pose_input_height: 256

vsvig_checkpoint: model_paper_finetuned.pth
vsvig_dy_order: dy_point_order.pt

# Two-head full-fit CJ ensemble used by the deployable package.
cj_checkpoint_seed123: cj_fullfit_distilled_w0p5_seed123.pt
cj_checkpoint_seed789: cj_fullfit_distilled_w0p5_seed789.pt

vivit_model_name: google/vivit-b-16x2-kinetics400
vivit_local_files_only: true
cj_use_amp: true
pose_use_amp: true
cuda_streams: true

# Series gate parameters.
gate_lower_bound: 0.20
gate_alpha: 0.30
gate_threshold: 0.49451708793640137

# Pose confidence gate.
pose_conf_gate: 0.10
pose_reuse_max_sec: 10.0

# Alert manager.
alert_hold_sec: 30.0
cj_max_age_normal: 15.0
cj_max_age_alert: 60.0
ap_window_sec: 3.0

# Runtime.
patient_branch_fps: 5.0
