<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Chatbot</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background-color: #f4f7f6; color: #333; overflow: hidden; }
    
    /* Sidebar (Patient Hub) */
    #sidebar { width: 340px; background-color: #1a3a5c; color: white; display: flex; flex-direction: column; padding: 20px; transition: 0.3s; }
    #sidebar.hidden { transform: translateX(-100%); margin-right: -340px; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sidebar-header h2 { margin: 0; font-size: 20px; }
    .btn-add { background: #0d7377; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    /* Tabs */
    .tabs { display: flex; background: rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
    .tab { flex: 1; padding: 10px 0; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: #aac8e0; transition: 0.2s; }
    .tab.active { background: #0d7377; color: white; }
    .tab-content { display: none; flex: 1; overflow-y: auto; }
    .tab-content.active { display: flex; flex-direction: column; gap: 10px; }

    /* Filters */
    .filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .filter-chip { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; color: #ddd; }
    .filter-chip.active { background: #0d7377; color: white; }

    /* Patient Items */
    .patient-item { padding: 12px; background-color: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
    .patient-item:hover { background-color: rgba(255,255,255,0.1); }
    .patient-item.active { background-color: rgba(255,255,255,0.15); border-left-color: #0d7377; }
    .patient-name { font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .patient-meta { font-size: 12px; color: #aac8e0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-recent { background-color: #2ecc71; }
    .status-older { background-color: #95a5a6; }

    /* Search Input */
    .search-input { width: 100%; padding: 10px; border-radius: 6px; border: none; background: rgba(255,255,255,0.9); margin-bottom: 15px; }

    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; background-color: #fff; position: relative; }
    
    /* Header & Mode Switch */
    #chat-header { padding: 15px 30px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .mode-switch { display: flex; background: #eee; border-radius: 20px; overflow: hidden; }
    .mode-btn { padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-weight: 600; color: #666; transition: 0.2s; }
    .mode-btn.active.patient { background: #3498db; color: white; }
    .mode-btn.active.general { background: #0d7377; color: white; }
    
    .patient-info-pill { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 6px 12px; border-radius: 20px; border: 1px solid #e0e0e0; }
    
    /* Messages */
    #messages { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    .msg { max-width: 80%; padding: 15px 20px; border-radius: 12px; line-height: 1.5; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .msg.doctor { background-color: #e3f2fd; color: #0d47a1; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.bot { background-color: #f8f9fa; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e9ecef; width: 100%; }
    
    .msg.bot img.uploaded-image { max-width: 250px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; }
    .msg.bot .image-tag { display: inline-block; background: #e0e0e0; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-bottom: 10px; }

    /* Thinking UI */
    .think-block {
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #0d7377;
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .think-header {
      padding: 10px 16px;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: color 0.2s ease, background-color 0.2s ease;
    }
    .think-header:hover {
      background-color: #f1f5f9;
      color: #0d7377;
    }
    .think-content {
      padding: 12px 16px 16px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      color: #334155;
      background: rgba(241, 245, 249, 0.5);
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .think-content.expanded {
      display: block;
    }
    .think-arrow {
      transition: transform 0.2s ease;
      display: inline-block;
      font-size: 10px;
      color: #64748b;
    }
    .think-block.expanded .think-arrow {
      transform: rotate(180deg);
    }
    .think-content p { margin: 4px 0; }
    .think-content ul, .think-content ol { margin: 4px 0; padding-left: 20px; }
    .think-content li { margin: 2px 0; }
    
    /* Typing Dots */
    .typing-dot { display: inline-block; width: 6px; height: 6px; background-color: #888; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* Pipeline Status UI */
    .pipeline-container {
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      padding: 15px;
      font-size: 14px;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.3s ease-out;
      transition: opacity 0.3s ease;
      max-width: 400px;
    }
    .pipeline-step {
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      opacity: 0.4;
    }
    .pipeline-step.active {
      opacity: 1;
      font-weight: 600;
      color: #1e293b;
    }
    .pipeline-step.done {
      opacity: 0.7;
      color: #64748b;
    }
    .step-indicator {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e2e8f0;
      font-size: 11px;
      font-weight: bold;
      color: #64748b;
      transition: all 0.3s ease;
    }
    .pipeline-step.active .step-indicator {
      background: #3b82f6;
      color: white;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      animation: pulseGlow 1.5s infinite;
    }
    .pipeline-step.done .step-indicator {
      background: #10b981;
      color: white;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }


    /* Input Area */
    #input-area { padding: 12px 20px 20px; background: #fff; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    #query-input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; resize: none; outline: none; transition: 0.2s; max-height: 150px; }
    #query-input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
    
    .btn-icon { background: #f0f0f0; border: none; padding: 12px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; }
    .btn-icon:hover { background: #e0e0e0; }
    .btn-icon.has-image { background: #e3f2fd; color: #1565c0; }
    #send-btn { background: #3498db; color: white; border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; height: 50px; }
    #send-btn:hover { background: #2980b9; }
    #stop-btn { background: #e74c3c; color: white; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; display: none; height: 50px; }

    /* Image Preview Strip */
    #image-preview-strip { display: none; align-items: center; gap: 10px; background: #f0f7ff; border: 1px solid #cce0ff; border-radius: 10px; padding: 8px 12px; }
    #image-preview-strip img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid #aac8e0; }
    #image-preview-strip .strip-info { flex: 1; }
    #image-preview-strip .strip-filename { font-size: 13px; font-weight: 600; color: #1a3a5c; }
    #image-preview-strip select { font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 3px 6px; margin-top: 4px; }
    #image-preview-strip .strip-remove { background: none; border: none; cursor: pointer; font-size: 18px; color: #999; padding: 0 4px; }
    #image-preview-strip .strip-remove:hover { color: #e74c3c; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-content h3 { margin-top: 0; color: #1a3a5c; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-cancel { background: #eee; color: #444; }
    .btn-save { background: #1a3a5c; color: white; }
    
    /* Login Screen */
    #login-screen { position: fixed; inset: 0; background: #f4f7f6; z-index: 300; display: flex; align-items: center; justify-content: center; }
    #login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    #login-btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }

    /* Empty State */
    #no-patient { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; font-size: 18px; }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <div id="login-box">
      <h1 style="color:#1a3a5c; margin-top:0;">🏥 Medical Chatbot</h1>
      <p style="color:#666; margin-bottom: 30px;">Sign in with your doctor credentials</p>
      <div class="form-group" style="text-align: left;">
        <label>Email</label>
        <input type="email" id="email" value="doctor@hospital.com" />
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" id="password" value="doctor123" />
      </div>
      <button id="login-btn" onclick="login()">Sign In</button>
      <div id="login-error" style="color: red; margin-top: 10px;"></div>
    </div>
  </div>

  <!-- Register Patient Modal -->
  <div id="reg-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>🆕 Register New Patient</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="reg-dob" />
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select id="reg-gender">
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Blood Type</label>
        <select id="reg-blood">
          <option value="O+">O+</option><option value="O-">O-</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
        </select>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="reg-phone" placeholder="555-0101" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('reg-modal')">Cancel</button>
        <button class="btn-save" id="reg-btn" onclick="registerPatient()">Register</button>
      </div>
    </div>
  </div>

  <!-- Image Upload Modal -->
  <div id="upload-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>📎 Analyze Medical Image</h3>
      <div class="form-group">
        <label>Image Type</label>
        <select id="img-type">
          <option value="xray">Chest X-Ray</option>
          <option value="ct_mri">CT / MRI Scan</option>
          <option value="lab_report">Lab Report (Text OCR)</option>
          <option value="handwritten">Handwritten Clinical Notes</option>
          <option value="dermatology">Dermatology Lesion</option>
          <option value="general">General Medical Image</option>
        </select>
      </div>
      <div class="form-group">
        <label>Select Image File</label>
        <input type="file" id="img-file" accept="image/*" />
      </div>
      <div class="form-group">
        <label>Specific Question (Optional)</label>
        <input type="text" id="img-question" placeholder="E.g., Are there signs of pneumonia?" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('upload-modal')">Cancel</button>
        <button class="btn-save" onclick="uploadImage()">Analyze Image</button>
      </div>
    </div>
  </div>

  <!-- Sidebar: Patient Hub -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>👥 Patient Hub</h2>
      <button class="btn-add" onclick="openModal('reg-modal')">+ Add</button>
    </div>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('recent')" id="tab-recent">⏱ Recent</div>
      <div class="tab" onclick="switchTab('browse')" id="tab-browse">📋 Browse</div>
      <div class="tab" onclick="switchTab('search')" id="tab-search">🔍 Search</div>
    </div>

    <!-- Tab 1: Recent -->
    <div id="content-recent" class="tab-content active">
      <!-- Populated by JS -->
    </div>

    <!-- Tab 2: Browse -->
    <div id="content-browse" class="tab-content">
      <div class="filters" id="browse-filters">
        <span class="filter-chip active" data-type="all" onclick="applyFilter(this)">All</span>
        <span class="filter-chip" data-type="gender" data-val="M" onclick="applyFilter(this)">Male</span>
        <span class="filter-chip" data-type="gender" data-val="F" onclick="applyFilter(this)">Female</span>
        <span class="filter-chip" data-type="blood" data-val="A+" onclick="applyFilter(this)">A+</span>
        <span class="filter-chip" data-type="blood" data-val="O+" onclick="applyFilter(this)">O+</span>
      </div>
      <div id="browse-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button onclick="loadMoreBrowse()" style="background:transparent; color:#aac8e0; border:1px solid #aac8e0; padding:8px; border-radius:6px; cursor:pointer;">Load More</button>
    </div>

    <!-- Tab 3: Search -->
    <div id="content-search" class="tab-content">
      <input type="text" id="patient-search" class="search-input" placeholder="Search by name..." oninput="searchPatients(this.value)" />
      <div id="search-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <div style="margin-top:auto; padding-top:20px; text-align:center;">
      <button onclick="logout()" style="background:transparent; color:#aac8e0; border:none; cursor:pointer; font-size:13px;">🚪 Sign Out</button>
    </div>
  </div>

  <!-- Main Area -->
  <div id="main">
    <div id="chat-header">
      <div class="mode-switch">
        <button class="mode-btn active patient" id="btn-mode-patient" onclick="setMode('patient')">🏥 Patient Chat</button>
        <button class="mode-btn general" id="btn-mode-general" onclick="setMode('general')">🩺 General Q&A</button>
      </div>
      
      <div id="header-patient-info" class="patient-info-pill" style="display:none;">
        <span style="font-size:20px">🧑‍⚕️</span>
        <div>
          <div id="hp-name" style="font-weight:bold; font-size:14px;">Select Patient</div>
          <div id="hp-meta" style="font-size:11px; color:#666;"></div>
        </div>
      </div>
    </div>

    <div id="no-patient">
      <span style="font-size:48px">💬</span>
      <span id="no-pt-text">Select a patient from the hub to start chatting</span>
    </div>

    <div id="messages" style="display:none;"></div>

    <div id="input-area">
      <!-- Hidden file picker -->
      <input type="file" id="attach-file" accept="image/*" style="display:none" onchange="onImageAttached(this)" />

      <!-- Inline image preview strip (shown after attach) -->
      <div id="image-preview-strip">
        <img id="preview-thumb" src="" alt="preview" />
        <div class="strip-info">
          <div class="strip-filename" id="preview-name"></div>
          <select id="inline-img-type">
            <option value="xray">Chest X-Ray</option>
            <option value="ct_mri">CT / MRI Scan</option>
            <option value="lab_report">Lab Report</option>
            <option value="handwritten">Handwritten Notes</option>
            <option value="dermatology">Dermatology</option>
            <option value="general" selected>General Medical Image</option>
          </select>
        </div>
        <button class="strip-remove" onclick="clearAttachment()" title="Remove image">✕</button>
      </div>

      <!-- Main input row -->
      <div class="input-row">
        <button class="btn-icon" id="attach-btn" onclick="document.getElementById('attach-file').click()" title="Attach medical image">📎</button>
        <textarea id="query-input" rows="1" placeholder="Ask a medical question..." onkeydown="handleKey(event)"></textarea>
        <button id="stop-btn" onclick="stopGeneration()">⏹ Stop</button>
        <button id="send-btn" onclick="sendMessage()">Send ➤</button>
      </div>
    </div>
  </div>

  <script>
    const API = (window.location.protocol === 'file:' ? 'http://localhost' : (window.location.protocol + '//' + window.location.hostname)) + ':8000';
    let token = localStorage.getItem('token');
    let currentPatient = null;
    let ws = null;
    let currentMode = 'patient'; // 'patient' or 'general'
    let browseOffset = 0;
    let currentFilter = { gender: null, blood: null };

    // Authenticated fetch — auto-logout on token expiry (401)
    async function authFetch(url, opts = {}) {
      opts.headers = { ...(opts.headers || {}), 'Authorization': `Bearer ${token}` };
      const res = await fetch(url, opts);
      if (res.status === 401) {
        alert('Your session has expired. Please log in again.');
        logout();
        throw new Error('Unauthorized');
      }
      return res;
    }

    // Chat rendering state
    let botMsgDiv = null;
    let thinkBlock = null;

    if (token) {
      document.getElementById('login-screen').style.display = 'none';
      initApp();
    }

    async function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      document.getElementById('login-btn').textContent = 'Signing in...';
      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        if (!res.ok) throw new Error('Invalid credentials');
        const data = await res.json();
        token = data.access_token;
        localStorage.setItem('token', token);
        document.getElementById('login-screen').style.display = 'none';
        initApp();
      } catch (e) {
        document.getElementById('login-error').textContent = e.message;
        document.getElementById('login-btn').textContent = 'Sign In';
      }
    }

    function logout() { localStorage.removeItem('token'); location.reload(); }
    
    function initApp() {
      renderRecentTab();
      loadBrowse();
      searchPatients('');
      connectWebSocket();
    }

    // ── UI Modals ─────────────────────────────────────────────────────────────
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function registerPatient() {
      const name = document.getElementById('reg-name').value;
      const dob = document.getElementById('reg-dob').value;
      const gender = document.getElementById('reg-gender').value;
      const blood_type = document.getElementById('reg-blood').value;
      const phone = document.getElementById('reg-phone').value;

      if (!name) return alert("Name required");
      document.getElementById('reg-btn').disabled = true;

      try {
        const res = await fetch(`${API}/api/patients`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name, dob, gender, blood_type, phone })
        });
        if (!res.ok) throw new Error('Failed to register');
        closeModal('reg-modal');
        const newPt = await res.json();
        selectPatient(newPt);
      } catch (e) { alert(e.message); }
      finally { document.getElementById('reg-btn').disabled = false; }
    }

    // ── Patient Hub (Tabs) ────────────────────────────────────────────────────
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`content-${tabId}`).classList.add('active');
    }

    function renderPatientItem(p, isRecent = false) {
      const statusClass = isRecent ? 'status-recent' : 'status-older';
      const meta = `${p.gender || '?'} · ${p.blood_type || '?'} ${p.dob ? '· '+p.dob : ''}`;
      return `
        <div class="patient-item ${currentPatient?.id === p.id ? 'active' : ''}" 
             onclick="selectPatient({id:${p.id}, name:'${p.name.replace(/'/g, "\\'")}', gender:'${p.gender||''}', blood_type:'${p.blood_type||''}'})">
          <div class="patient-name">
            <span class="status-dot ${statusClass}"></span> ${p.name}
          </div>
          <div class="patient-meta">${meta}</div>
        </div>
      `;
    }

    function trackRecent(p) {
      let recents = JSON.parse(localStorage.getItem('recentPts') || '[]');
      recents = recents.filter(x => x.id !== p.id);
      recents.unshift(p);
      recents = recents.slice(0, 8);
      localStorage.setItem('recentPts', JSON.stringify(recents));
      renderRecentTab();
    }

    function renderRecentTab() {
      const recents = JSON.parse(localStorage.getItem('recentPts') || '[]');
      const container = document.getElementById('content-recent');
      if (recents.length === 0) {
        container.innerHTML = '<div style="color:#aac8e0; text-align:center; padding:20px;">No recent patients. Search or browse to find one.</div>';
        return;
      }
      container.innerHTML = recents.map(p => renderPatientItem(p, true)).join('');
    }

    async function loadBrowse(reset = true) {
      if (reset) { browseOffset = 0; document.getElementById('browse-list').innerHTML = ''; }
      let url = `${API}/api/patients?limit=20&offset=${browseOffset}`;
      if (currentFilter.gender) url += `&gender=${currentFilter.gender}`;
      if (currentFilter.blood) url += `&blood_type=${encodeURIComponent(currentFilter.blood)}`;
      try {
        const res = await authFetch(url);
        const pts = await res.json();
        const html = pts.map(p => renderPatientItem(p)).join('');
        document.getElementById('browse-list').innerHTML += html;
      } catch (e) { if (e.message !== 'Unauthorized') console.error(e); }
    }

    function loadMoreBrowse() { browseOffset += 20; loadBrowse(false); }

    function applyFilter(el) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const type = el.dataset.type;
      const val = el.dataset.val;
      currentFilter = { gender: null, blood: null };
      if (type !== 'all') currentFilter[type] = val;
      loadBrowse(true);
    }

    async function searchPatients(val) {
      try {
        const res = await authFetch(`${API}/api/patients?search=${val}&limit=20`);
        const pts = await res.json();
        document.getElementById('search-list').innerHTML = pts.map(p => renderPatientItem(p)).join('');
      } catch (e) { if (e.message !== 'Unauthorized') console.error(e); }
    }

    // ── Mode & Selection ──────────────────────────────────────────────────────
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-patient').classList.toggle('active', mode === 'patient');
      document.getElementById('btn-mode-general').classList.toggle('active', mode === 'general');
      
      const sb = document.getElementById('sidebar');
      const hp = document.getElementById('header-patient-info');
      const noPt = document.getElementById('no-patient');
      const msgs = document.getElementById('messages');
      
      if (mode === 'general') {
        sb.classList.add('hidden');
        hp.style.display = 'none';
        noPt.style.display = 'none';
        msgs.style.display = 'flex';
        document.getElementById('query-input').placeholder = "Ask MedGemma any general medical question...";
        
        // Reset the chat history for a fresh General Q&A experience
        msgs.innerHTML = '';
        addMessage('bot', "Hello! I am in **General Q&A** mode. Feel free to ask me any medical question, and I will assist you with step-by-step clinical reasoning.");
      } else {
        sb.classList.remove('hidden');
        if (currentPatient) {
          hp.style.display = 'flex';
          noPt.style.display = 'none';
          msgs.style.display = 'flex';
        } else {
          hp.style.display = 'none';
          noPt.style.display = 'flex';
          msgs.style.display = 'none';
        }
        document.getElementById('query-input').placeholder = "Ask about the selected patient...";
      }
    }

    function selectPatient(p) {
      currentPatient = p;
      trackRecent(p);
      setMode('patient');
      
      document.getElementById('hp-name').textContent = p.name;
      document.getElementById('hp-meta').textContent = `${p.gender||'?'} · ${p.blood_type||'?'}`;
      
      document.getElementById('messages').innerHTML = '';
      addMessage('bot', `Hello! I have loaded **${p.name}'s** records. What would you like to know?`);
      
      // Update highlights
      document.querySelectorAll('.patient-item').forEach(el => el.classList.remove('active'));
      renderRecentTab(); // re-render to update active state
    }

    // ── WebSocket & Streaming UI ──────────────────────────────────────────────
    function connectWebSocket() {
      if (ws) ws.close();
      ws = new WebSocket('ws://' + window.location.hostname + ':8000/api/ws/chat');
      ws.onopen = () => console.log('WS connected');
      ws.onmessage = (e) => handleStreamEvent(JSON.parse(e.data));
    }

    let pipelineEl = null;

    function getOrCreatePipeline(mode) {
      if (!botMsgDiv) botMsgDiv = createBotBubble();
      if (pipelineEl) return pipelineEl;

      pipelineEl = document.createElement('div');
      pipelineEl.className = 'pipeline-container';
      
      let stepsHtml = '';
      if (mode === 'image') {
        stepsHtml = `
          <div class="pipeline-step" id="step-image">
            <div class="step-indicator">1</div>
            <span>🔬 Preparing medical image...</span>
          </div>
          <div class="pipeline-step" id="step-llm">
            <div class="step-indicator">2</div>
            <span>🧠 Consulting MedGemma 1.5...</span>
          </div>
        `;
      } else if (currentMode === 'general') {
        stepsHtml = `
          <div class="pipeline-step" id="step-intent">
            <div class="step-indicator">1</div>
            <span>Defining user intent...</span>
          </div>
          <div class="pipeline-step" id="step-llm">
            <div class="step-indicator">2</div>
            <span>🧠 Consulting MedGemma 1.5...</span>
          </div>
        `;
      } else {
        stepsHtml = `
          <div class="pipeline-step" id="step-intent">
            <div class="step-indicator">1</div>
            <span>Defining user intent...</span>
          </div>
          <div class="pipeline-step" id="step-ner">
            <div class="step-indicator">2</div>
            <span>Extracting medical entities...</span>
          </div>
          <div class="pipeline-step" id="step-retrieval">
            <div class="step-indicator">3</div>
            <span>Fetching matching records...</span>
          </div>
          <div class="pipeline-step" id="step-llm">
            <div class="step-indicator">4</div>
            <span>🧠 Consulting MedGemma 1.5...</span>
          </div>
        `;
      }


      pipelineEl.innerHTML = stepsHtml;
      botMsgDiv.querySelector('.text').insertBefore(pipelineEl, botMsgDiv.querySelector('.answer-body'));
      scrollToBottom();
      return pipelineEl;
    }

    function handleStreamEvent(data) {
      if (data.error) {
        addMessage('bot', '❌ Error: ' + data.error);
        finishStream();
        return;
      }

      // Handle intermediate status step events
      if (data.type === 'status') {
        const pipe = getOrCreatePipeline(data.step === 'image' ? 'image' : currentMode);
        const stepEl = pipe.querySelector(`#step-${data.step}`);
        if (stepEl) {
          if (data.status === 'active') {
            pipe.querySelectorAll('.pipeline-step').forEach(s => s.classList.remove('active'));
            stepEl.classList.add('active');
            stepEl.classList.remove('done');
            stepEl.querySelector('.step-indicator').innerHTML = '⏳';
          } else if (data.status === 'done') {
            stepEl.classList.remove('active');
            stepEl.classList.add('done');
            stepEl.querySelector('.step-indicator').innerHTML = '✓';
          }
        }
        return;
      }

      // Ensure LLM step is active during reasoning/answering
      if (data.type === 'think_start' || data.type === 'chunk') {
        if (pipelineEl) {
          const llmStep = pipelineEl.querySelector('#step-llm');
          if (llmStep && !llmStep.classList.contains('active') && !llmStep.classList.contains('done')) {
            // Mark previous steps as done
            pipelineEl.querySelectorAll('.pipeline-step').forEach(s => {
              if (s !== llmStep) {
                s.classList.remove('active');
                s.classList.add('done');
                s.querySelector('.step-indicator').innerHTML = '✓';
              }
            });
            // Activate LLM step
            llmStep.classList.add('active');
            llmStep.querySelector('.step-indicator').innerHTML = '⏳';
          }
        }
      }

      if (data.type === 'think_start') {
        // Create the bot bubble only on the very first think block
        if (!botMsgDiv) botMsgDiv = createBotBubble();
        // Always create a fresh think block and append to the same bubble
        thinkBlock = document.createElement('div');
        thinkBlock.className = 'think-block expanded';
        thinkBlock.innerHTML = `
          <div class="think-header" onclick="this.parentElement.classList.toggle('expanded'); this.nextElementSibling.classList.toggle('expanded')">
            <span>🧠 Thinking <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>
            <span class="think-arrow">▼</span>
          </div>
          <div class="think-content expanded" data-raw=""></div>
        `;
        botMsgDiv.querySelector('.text').appendChild(thinkBlock);
        scrollToBottom();
      } 
      else if (data.type === 'think') {
        if (thinkBlock) {
          const contentEl = thinkBlock.querySelector('.think-content');
          // Append raw chunk
          contentEl.dataset.raw = (contentEl.dataset.raw || '') + data.chunk;
          // Split by newline and render each line separately for line‑by‑line view
          const lines = contentEl.dataset.raw.split('\n');
          const rendered = lines.map(l => marked.parse(l)).join('\n');
          contentEl.innerHTML = rendered;
          scrollToBottom();
        }
      } 
      else if (data.type === 'think_done') {
        if (thinkBlock) {
          const duration = data.duration || 0;
          thinkBlock.querySelector('.think-header span:first-child').innerHTML =
            `🧠 Thought for ${duration}s`;
          // Collapse the block once thinking is done
          thinkBlock.querySelector('.think-content').classList.remove('expanded');
          thinkBlock.classList.remove('expanded');
          thinkBlock = null; // reset so next think_start creates a fresh block
        }
      } 
      else if (data.type === 'chunk') {
        // Create bubble if it somehow doesn't exist yet (no think block before answer)
        if (!botMsgDiv) botMsgDiv = createBotBubble();
        const textDiv = botMsgDiv.querySelector('.answer-body');
        textDiv.dataset.raw = (textDiv.dataset.raw || '') + data.chunk;
        textDiv.innerHTML = marked.parse(textDiv.dataset.raw);
        scrollToBottom();
      } 
      else if (data.type === 'done') {
        finishStream();
      }
    }


    function finishStream() {
      document.getElementById('send-btn').style.display = 'block';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('query-input').disabled = false;

      // Mark LLM step as completed before fading
      if (pipelineEl) {
        const llmStep = pipelineEl.querySelector('#step-llm');
        if (llmStep) {
          llmStep.classList.remove('active');
          llmStep.classList.add('done');
          llmStep.querySelector('.step-indicator').innerHTML = '✓';
        }
        
        // Beautiful fade-out transition after response is complete
        pipelineEl.style.opacity = '0';
        setTimeout(() => { if (pipelineEl) { pipelineEl.remove(); pipelineEl = null; } }, 400);
      }

      botMsgDiv = null; thinkBlock = null;
    }


    // ── Pending Image Attachment State ────────────────────────────────────────
    let pendingImageFile = null;

    function onImageAttached(input) {
      if (!input.files.length) return;
      pendingImageFile = input.files[0];

      // Show preview strip
      const strip = document.getElementById('image-preview-strip');
      const thumb = document.getElementById('preview-thumb');
      const nameEl = document.getElementById('preview-name');
      const attachBtn = document.getElementById('attach-btn');

      const reader = new FileReader();
      reader.onload = (e) => { thumb.src = e.target.result; };
      reader.readAsDataURL(pendingImageFile);

      nameEl.textContent = pendingImageFile.name.length > 28
        ? pendingImageFile.name.slice(0, 25) + '...'
        : pendingImageFile.name;

      strip.style.display = 'flex';
      attachBtn.classList.add('has-image');
      document.getElementById('query-input').placeholder = 'Ask about this image (or leave blank for full analysis)...';
      // Reset file input so the same file can be re-selected if removed
      input.value = '';
    }

    function clearAttachment() {
      pendingImageFile = null;
      document.getElementById('image-preview-strip').style.display = 'none';
      document.getElementById('attach-btn').classList.remove('has-image');
      document.getElementById('query-input').placeholder = 'Ask a medical question...';
    }

    function sendMessage() {
      const input = document.getElementById('query-input');
      const query = input.value.trim();

      // Require at least an image OR a text query
      if (!query && !pendingImageFile) return;
      if (currentMode === 'patient' && !currentPatient) return alert('Select a patient first.');

      input.value = '';
      document.getElementById('send-btn').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'block';
      input.disabled = true;

      if (pendingImageFile) {
        // ── Image path: SSE endpoint ─────────────────────────────────────────
        const file = pendingImageFile;
        const imgType = document.getElementById('inline-img-type').value;
        clearAttachment();

        // Show user message with image thumbnail + question
        const userDiv = document.createElement('div');
        userDiv.className = 'msg doctor';
        const thumbReader = new FileReader();
        thumbReader.onload = (e) => {
          userDiv.innerHTML = `
            <div style="margin-bottom:6px; font-size:12px; opacity:0.8;">📎 ${imgType.replace('_',' ')}</div>
            <img src="${e.target.result}" style="max-width:220px; border-radius:8px; display:block; margin-bottom:6px;" />
            <div>${query || '(Full analysis)'}</div>
          `;
        };
        thumbReader.readAsDataURL(file);
        document.getElementById('messages').appendChild(userDiv);
        scrollToBottom();

        // Show immediate pipeline status indicator for image
        getOrCreatePipeline('image');

        const fd = new FormData();
        fd.append('image', file);
        fd.append('image_type', imgType);
        fd.append('question', query);
        fd.append('token', token);
        if (currentMode === 'patient' && currentPatient) fd.append('patient_id', currentPatient.id);

        (async () => {
          try {
            const res = await fetch(`${API}/api/chat/analyze-image`, { method: 'POST', body: fd });
            if (!res.ok) {
              const errText = await res.text();
              addMessage('bot', `❌ Server error ${res.status}: ${errText}`);
              finishStream();
              return;
            }
            const streamReader = res.body.getReader();
            const decoder = new TextDecoder();
            let leftover = '';
            while (true) {
              const { value, done } = await streamReader.read();
              if (done) break;
              const text = leftover + decoder.decode(value, { stream: true });
              const lines = text.split('\n');
              leftover = lines.pop(); // last incomplete line
              for (const line of lines) {
                if (line.startsWith('data: ')) {
                  try {
                    const evt = JSON.parse(line.slice(6));
                    handleStreamEvent(evt);
                  } catch {}
                }
              }
            }

          } catch (e) {
            addMessage('bot', '❌ Upload failed: ' + e.message);
            finishStream();
          }
        })();

      } else {
        // ── Text path: WebSocket ─────────────────────────────────────────────
        addMessage('doctor', query);
        ws.send(JSON.stringify({ query, patient_id: currentPatient?.id, mode: currentMode, token }));
      }
    }

    function stopGeneration() {
      ws.send(JSON.stringify({ type: "stop" }));
      finishStream();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }


    // ── Helpers ───────────────────────────────────────────────────────────────
    function addMessage(role, text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'bot') {
        div.innerHTML = `<div class="answer-body">${marked.parse(text)}</div>`;
      } else {
        div.textContent = text;
      }
      msgs.appendChild(div);
      scrollToBottom();
      return div;
    }

    function createBotBubble() {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = `<div class="text"><div class="answer-body" data-raw=""></div></div>`;
      msgs.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
